[build-system]
requires = ["hatching"]
build-backend = "hatching.build"

[project]
name = "salesreport"
version = "0.1.0"
description = "Daily store revenue reporting CLI"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.7",
]
[project.scripts]
salesreport = "salesreport.cli:cli"

[tool.hatch.wheel]
packages = ["src/salesreport"]